name: Build vTools Survey IPA



on:

  workflow_dispatch:
  
  push:
  
    tags:
    
      - 'v*'
      


jobs:

  build-ipa:
  
    runs-on: macos-15
    
    steps:
    
      - name: Checkout
      
        uses: actions/checkout@v4
        
      - name: Extract source archive
      
        run: unzip -q vtools-survey-ios-source-v3.zip -d source
        
      - name: Setup pnpm
      
        uses: pnpm/action-setup@v4
        
        with:
        
          version: 9.12.0
          
      - name: Setup Node
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: pnpm
          
          cache-dependency-path: source/pnpm-lock.yaml
          
      - name: Install dependencies
      
        working-directory: source
        
        run: pnpm install --frozen-lockfile
        
      - name: Validate project
      
        working-directory: source
        
        run: pnpm check
        
      - name: Generate native iOS project
      
        working-directory: source
        
        env:
        
          CI: '1'
          
        run: pnpm exec expo prebuild --platform ios --clean
        
      - name: Install CocoaPods
      
        working-directory: source
        
        run: pod install --project-directory=ios --repo-update
        
      - name: Inspect native project
      
        working-directory: source
        
        run: find ios -maxdepth 2 -type f -print
        
      - name: Build unsigned Release app
      
        working-directory: source
        
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          rm -rf build
          
          mkdir -p build
          
          xcodebuild -workspace ios/vToolsSurveyiOS.xcworkspace -scheme vToolsSurveyiOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=NO EXPANDED_CODE_SIGN_IDENTITY='' CODE_SIGNING_ENTITLEMENTS='' IPHONEOS_DEPLOYMENT_TARGET=17.0 clean build 2>&1 | tee build/xcodebuild.log
          
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          
          test -n "$APP_PATH"
          
          rm -rf build/Payload
          
          mkdir -p build/Payload
          
          cp -R "$APP_PATH" build/Payload/
          
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/vtools-survey-ios.ipa
          
          test -s build/vtools-survey-ios.ipa
          
          unzip -l build/vtools-survey-ios.ipa | head -30
          
      - name: Upload IPA artifact
      
        if: success()
        
        uses: actions/upload-artifact@v4
        
        with:
        
          name: vtools-survey-ios-trollstore
          
          path: source/build/vtools-survey-ios.ipa
          
          if-no-files-found: error
          
          retention-days: 30
          
      - name: Upload xcodebuild log
      
        if: always()
        
        uses: actions/upload-artifact@v4
        
        with:
        
          name: vtools-survey-ios-xcodebuild-log
          
          path: source/build/xcodebuild.log
          
          if-no-files-found: ignore
          
          retention-days: 7
          






































































